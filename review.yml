      The official GitHub org (vanderbiltu) is real but has zero public repos.
      The Heard Libraries GitHub org is active with open linked-data and
      institutional-repository code, and the library runs Ex Libris Alma/Primo
      (OAI-PMH capable), but no Vanderbilt-specific public API documentation was
      confirmed. No official self-service, publicly documented API found.
