  - date: '2026-09-01'
    rating: 6
    summary: >-
      Re-profiled under the university pipeline's operator axis. The 2026-06-03 conclusion —
      "no official self-service, publicly documented API found" — is now superseded: three
      institution-operated, publicly callable APIs were verified live, all of them the Jean
      and Alexander Heard Libraries' work, none of them requiring a credential. The
      Television News Archive serverless API returns 200 unauthenticated across service root,
      archive totals, date range, metadata filter vocabularies, broadcast retrieval and
      keyword search, over 98,371 broadcasts and 969,224 news segments going back to 5 August
      1968. sparql.vanderbilt.edu/sparql is a live SPARQL 1.1 endpoint answering both GET and
      direct-POST bindings over 14,366,116 triples. The Vanderbilt Institutional Repository is
      a self-hosted DSpace 9.1 deployment on the university's own domain with an open HAL
      REST root and a working OAI-PMH endpoint whose Identify names Vanderbilt's own
      repository identifier and administrative contact. Two federation surfaces publish live
      metadata: an Okta org on onevu.vanderbilt.edu and the vanderbilt.edu Microsoft Entra ID
      tenant. Registry memberships confirmed: Crossref member 6384 (prefix 10.15695, 2,375
      DOIs) and ROR 02vm5rt34. Library discovery is an Ex Libris Primo/Alma tenancy
      (01VAN_INST) and is recorded as a tenant relationship, not as Vanderbilt's contract; the
      DSpace and OAI-PMH product contracts are likewise not saved, only the deployments. Both
      surfaces the June profile did record are dead — the Azure APIM portal host returns
      NXDOMAIN in public DNS, and the VUIT API Services catalog page returns a persistent 500
      with no replacement anywhere in the current catalog index — and both pointers were
      removed. Vanderbilt still publishes no developer portal, no API key programme, no
      llms.txt and no apis.json, and github.com/vanderbiltu has zero public repositories.
