description: >-
  Vanderbilt University is a private research university in Nashville, Tennessee. Its
  programmable footprint is real but narrow, and it does not live where a company's would:
  there is no central developer portal, no API key, and no self-service onboarding anywhere
  on vanderbilt.edu. What exists is operated almost entirely by the Jean and Alexander Heard
  Libraries, and all of it is open to the public without a credential. Three surfaces were
  verified live on 2026-09-01: the Vanderbilt Television News Archive serverless API, which
  serves 98,371 network television news broadcasts and 969,224 news segments recorded
  continuously since 5 August 1968; a public SPARQL 1.1 endpoint at sparql.vanderbilt.edu
  holding 14.4 million triples of linked open data; and the Vanderbilt Institutional
  Repository, a self-hosted DSpace 9.1 deployment exposing both a HAL REST API and an
  OAI-PMH endpoint under the university's own domain. Vanderbilt's identity estate — an Okta
  org on onevu.vanderbilt.edu and a Microsoft Entra ID tenant for vanderbilt.edu — publishes
  live OpenID Connect discovery and SAML 2.0 metadata. Library discovery runs on Ex Libris
  Alma/Primo as a vendor tenancy (01VAN_INST) and is not Vanderbilt's contract. The Azure API
  Management developer portal and the VUIT API Services catalog page recorded in the June 2026
  profile were re-probed and are both dead; they have been removed rather than left standing
  as claims.
