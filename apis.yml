apis:
  - aid: vanderbilt:television-news-archive
    name: Vanderbilt Television News Archive API
    description: >-
      Public read API behind tvnews.vanderbilt.edu, self-identifying as the "TVNA Serverless
      API" v1.0.0. Search, browse and retrieve United States network television news
      broadcasts and segments recorded continuously since 5 August 1968 — 98,371 broadcasts,
      969,224 news segments, 396,720 commercial segments, 58,517 hours of runtime. Every read
      operation probed returned 200 with no credential. Built and operated by the Jean and
      Alexander Heard Libraries; the source repository is HeardLibrary/TVNA-serverless-api.
      Vanderbilt publishes no OpenAPI for it, so the contract here is derived from live probes
      and is marked as such.
