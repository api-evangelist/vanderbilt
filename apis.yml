  detail: >-
    Three institution-operated, publicly callable APIs were found and verified live on
    2026-09-01 — the Television News Archive serverless API, a SPARQL 1.1 endpoint holding
    14.4M triples, and a self-hosted DSpace 9.1 repository with both a HAL REST API and an
    OAI-PMH endpoint — plus two federation surfaces (Okta and Entra ID) publishing live OIDC
    and SAML metadata, and two registry memberships (Crossref 6384, ROR 02vm5rt34). None of
    these appeared in the 2026-06-03 profile, which concluded no public API existed. What
    that profile did record was dead: apim-portal.app.vanderbilt.edu returns NXDOMAIN in
    public DNS and the VUIT API Services catalog page returns a persistent 500 with no
    replacement in the current catalog index; both pointers were removed. Vanderbilt still
    publishes no developer portal, no API key programme, no llms.txt, no apis.json and no
    robots.txt on www.vanderbilt.edu, and its GitHub org vanderbiltu has zero public
    repositories — the engineering that exists is the Heard Libraries', published under
    github.com/HeardLibrary.
