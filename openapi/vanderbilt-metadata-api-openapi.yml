openapi: 3.2.0
info:
  title: Vanderbilt Television News Archive Metadata API
  version: 1.0.0
  description: Read API for the Vanderbilt Television News Archive, the Jean and Alexander Heard Libraries' collection of United States network television news broadcasts recorded continuously since August 5, 1968.
  contact:
    name: Vanderbilt Television News Archive, Jean and Alexander Heard Libraries
    url: https://tvnews.vanderbilt.edu/
  license:
    name: Terms of use published by the Vanderbilt Television News Archive
    url: https://blog.tvnews.vanderbilt.edu/welcome/access-information/
servers:
- url: https://7itm2l2dz8.execute-api.us-east-1.amazonaws.com/prod
  description: Production stage. AWS API Gateway is Vanderbilt's own deployment infrastructure here, not a third-party SaaS product; the endpoint is referenced directly by the tvnews.vanderbilt.edu application bundle.
tags:
- name: Metadata
  description: Controlled vocabularies used to filter the archive.
paths:
  /search/metadata/filters:
    get:
      tags:
      - Metadata
      operationId: getMetadataFilters
      summary: Controlled vocabularies available as search facets
      parameters:
      - name: startDate
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Broadcast types, segment types and networks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataFilters'
components:
  schemas:
    MetadataFilters:
      type: object
      properties:
        data:
          type: object
          properties:
            broadcast_types:
              type: array
              items:
                $ref: '#/components/schemas/NamedTerm'
            segment_types:
              type: array
              items:
                $ref: '#/components/schemas/NamedTerm'
            networks:
              type: array
              items:
                $ref: '#/components/schemas/NamedTerm'
    NamedTerm:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
